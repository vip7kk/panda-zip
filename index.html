<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>熊猫图片压缩</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --panda-primary: #1a1a2e;
  --panda-accent: #e94560;
  --panda-green: #0f3460;
  --panda-teal: #16213e;
  --panda-gold: #f5c518;
  --panda-pink: #ff6b9d;
  --panda-blue: #4fc3f7;
  --panda-purple: #ab47bc;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: var(--panda-primary);
  padding: 30px 20px 0;
}

/* ===== 动态星空背景 ===== */
.bg-stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
.star {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle 2s ease-in-out infinite alternate;
}
.star.big { width: 6px; height: 6px; }
@keyframes twinkle {
  0% { opacity: 0.2; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1.2); }
}

/* ===== 浮动竹叶 ===== */
.bamboo-leaf {
  position: fixed;
  z-index: 1;
  pointer-events: none;
  opacity: 0.15;
  font-size: 30px;
  animation: floatLeaf linear infinite;
}
@keyframes floatLeaf {
  0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.15; }
  90% { opacity: 0.15; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}

/* ===== 主容器 ===== */
.container {
  width: 100%;
  max-width: 620px;
  position: relative;
  z-index: 10;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 32px;
  padding: 40px 35px;
  text-align: center;
  box-shadow:
    0 25px 60px rgba(0,0,0,0.3),
    0 0 40px rgba(233,69,96,0.1),
    inset 0 1px 0 rgba(255,255,255,0.1);
  animation: cardFloat 6s ease-in-out infinite;
}
@keyframes cardFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* ===== 卡通熊猫头像 ===== */
.panda-wrapper {
  display: inline-block;
  animation: pandaBounce 2s ease-in-out infinite;
  cursor: pointer;
  position: relative;
}
@keyframes pandaBounce {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-15px) rotate(-5deg); }
  50% { transform: translateY(0) rotate(0deg); }
  75% { transform: translateY(-8px) rotate(3deg); }
}
.panda-wrapper:hover {
  animation: pandaSpin 0.6s ease;
}
@keyframes pandaSpin {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.1); }
  100% { transform: rotate(360deg) scale(1); }
}

.panda-svg {
  width: 120px;
  height: 120px;
}

/* ===== 眨眼动画 ===== */
.panda-eye-white {
  animation: blink 4s ease-in-out infinite;
}
@keyframes blink {
  0%, 90%, 100% { ry: 14; }
  95% { ry: 2; }
}

/* ===== 标题 ===== */
h1 {
  margin: 15px 0 25px;
  font-size: 32px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 2px;
  position: relative;
  display: inline-block;
}
h1 .accent {
  color: var(--panda-accent);
  position: relative;
}
h1 .accent::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--panda-accent);
  border-radius: 2px;
  animation: underlinePulse 2s ease-in-out infinite;
}
@keyframes underlinePulse {
  0%, 100% { transform: scaleX(1); opacity: 1; }
  50% { transform: scaleX(1.3); opacity: 0.7; }
}

/* ===== 信息区 ===== */
.info {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 20px;
  line-height: 32px;
  color: rgba(255,255,255,0.8);
  font-size: 15px;
  position: relative;
  overflow: hidden;
}
.info::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(233,69,96,0.05), transparent, rgba(79,195,247,0.05), transparent);
  animation: infoRotate 10s linear infinite;
}
@keyframes infoRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.info b {
  color: var(--panda-gold);
  font-weight: 700;
}

/* ===== 使用次数 ===== */
.count {
  margin: 20px 0;
  padding: 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  color: rgba(255,255,255,0.75);
  font-size: 14px;
  line-height: 28px;
}
.count b {
  color: var(--panda-blue);
  font-weight: 700;
}

/* ===== 上传区 ===== */
.upload {
  display: block;
  padding: 45px 20px;
  border: 3px dashed rgba(233,69,96,0.5);
  border-radius: 24px;
  cursor: pointer;
  font-size: 17px;
  color: rgba(255,255,255,0.7);
  position: relative;
  transition: all 0.3s ease;
  background: rgba(233,69,96,0.03);
}
.upload:hover {
  border-color: var(--panda-accent);
  background: rgba(233,69,96,0.08);
  color: #fff;
  transform: scale(1.02);
  box-shadow: 0 0 30px rgba(233,69,96,0.15);
}
.upload.drag-over {
  border-color: var(--panda-gold);
  background: rgba(245,197,24,0.08);
  transform: scale(1.04);
  box-shadow: 0 0 40px rgba(245,197,24,0.2);
}
.upload-icon {
  font-size: 50px;
  display: block;
  margin-bottom: 12px;
  animation: uploadPulse 3s ease-in-out infinite;
}
@keyframes uploadPulse {
  0%, 100% { transform: scale(1) translateY(0); }
  50% { transform: scale(1.1) translateY(-5px); }
}
.upload .upload-text-main {
  font-size: 18px;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}
.upload .upload-text-sub {
  font-size: 14px;
  margin-top: 6px;
  color: rgba(255,255,255,0.5);
}
input[type="file"] { display: none; }

/* ===== 文件列表 ===== */
.files {
  margin-top: 20px;
  max-height: 260px;
  overflow: auto;
  text-align: left;
}
.files::-webkit-scrollbar {
  width: 6px;
}
.files::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
}
.file {
  position: relative;
  padding: 14px 55px 14px 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  margin-bottom: 10px;
  line-height: 22px;
  font-size: 14px;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  text-align: left;
  color: rgba(255,255,255,0.8);
  animation: fileSlideIn 0.4s ease-out backwards;
  transition: all 0.2s;
}
.file:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.15);
}
@keyframes fileSlideIn {
  from { transform: translateX(-20px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.file-name {
  color: #fff;
  font-weight: 500;
}
.file-size {
  color: rgba(255,255,255,0.5);
  font-size: 13px;
}
.delete-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin: 0;
  border: 0;
  border-radius: 50%;
  background: var(--panda-accent);
  color: white;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(233,69,96,0.3);
}
.delete-btn:hover {
  transform: translateY(-50%) scale(1.15);
  background: #c0392b;
}

/* ===== 开始按钮 ===== */
.btn-start {
  margin-top: 25px;
  width: 80%;
  padding: 16px;
  border: 0;
  border-radius: 40px;
  background: linear-gradient(135deg, var(--panda-accent), var(--panda-purple));
  color: white;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 2px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
  box-shadow:
    0 8px 25px rgba(233,69,96,0.3),
    0 0 0 0 rgba(233,69,96,0);
}
.btn-start:hover:not(:disabled) {
  transform: translateY(-3px);
  box-shadow:
    0 12px 35px rgba(233,69,96,0.4),
    0 0 20px rgba(233,69,96,0.2);
}
.btn-start:active:not(:disabled) {
  transform: translateY(-1px);
}
.btn-start:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn-start::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s;
}
.btn-start:hover:not(:disabled)::before {
  left: 100%;
}

/* ===== 进度条 ===== */
.progress {
  margin-top: 20px;
  color: rgba(255,255,255,0.7);
  font-size: 15px;
  font-weight: 500;
  display: none;
}
.progress.show {
  display: block;
}
.progress.success {
  color: var(--panda-gold);
  animation: successPop 0.5s ease;
}
@keyframes successPop {
  0% { transform: scale(0.8); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.bar {
  height: 14px;
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  overflow: hidden;
  margin-top: 12px;
  position: relative;
  display: none;
}
.bar.show {
  display: block;
}
.bar-inner {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--panda-accent), var(--panda-gold), var(--panda-blue));
  border-radius: 20px;
  transition: width 0.5s ease;
  position: relative;
  box-shadow: 0 0 10px rgba(233,69,96,0.3);
}
.bar-inner::after {
  content: '🐼';
  position: absolute;
  right: -2px;
  top: -18px;
  font-size: 16px;
  animation: pandaWalk 0.8s steps(2) infinite;
  filter: drop-shadow(0 0 3px rgba(0,0,0,0.3));
}
@keyframes pandaWalk {
  0% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* ===== 结果区 ===== */
.result {
  margin-top: 20px;
  padding: 18px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px;
  text-align: left;
  line-height: 28px;
  color: rgba(255,255,255,0.8);
  display: none;
}
.result.show {
  display: block;
  animation: resultFadeIn 0.5s ease;
}
@keyframes resultFadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.result b { color: var(--panda-gold); }

/* ===== 底部服务声明 ===== */
.footer {
  margin-top: 30px;
  padding: 18px 0 8px;
  border-top: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.35);
  font-size: 12px;
  letter-spacing: 1px;
}
.footer .tiny {
  color: rgba(255,255,255,0.55);
  font-weight: 600;
}

/* ===== 烟花/庆祝效果 ===== */
.confetti-container {
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
}
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  animation: confettiFall 3s ease-in forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ===== 闪烁粒子装饰 ===== */
.sparkle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: var(--panda-gold);
  border-radius: 50%;
  animation: sparkle 1.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0); }
  50% { opacity: 1; transform: scale(1); }
}

/* ===== 响应式 ===== */
@media (max-width: 480px) {
  .container { padding: 25px 20px; border-radius: 24px; }
  h1 { font-size: 24px; }
  .panda-svg { width: 80px; height: 80px; }
  .upload { padding: 30px 15px; }
  .upload-icon { font-size: 35px; }
}
</style>
</head>

<body>

<!-- 星空背景 -->
<div class="bg-stars" id="stars"></div>

<!-- 烟花容器 -->
<div class="confetti-container" id="confetti"></div>

<!-- 闪烁粒子 -->
<div class="sparkle" style="top:15%;left:8%;animation-delay:0s;"></div>
<div class="sparkle" style="top:30%;right:12%;animation-delay:0.5s;background:var(--panda-accent);"></div>
<div class="sparkle" style="top:60%;left:5%;animation-delay:1s;background:var(--panda-blue);"></div>
<div class="sparkle" style="top:75%;right:6%;animation-delay:1.5s;background:var(--panda-pink);"></div>
<div class="sparkle" style="top:45%;right:3%;animation-delay:0.8s;background:var(--panda-purple);"></div>

<!-- 主容器 -->
<div class="container">

  <!-- 卡通熊猫 -->
  <div class="panda-wrapper" id="pandaWrapper">
    <svg class="panda-svg" viewBox="0 0 120 120">
      <!-- 头 -->
      <ellipse cx="60" cy="65" rx="40" ry="42" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
      <!-- 耳朵 -->
      <ellipse cx="25" cy="28" rx="16" ry="14" fill="#1a1a2e"/>
      <ellipse cx="95" cy="28" rx="16" ry="14" fill="#1a1a2e"/>
      <ellipse cx="25" cy="28" rx="10" ry="8" fill="#2d2d44"/>
      <ellipse cx="95" cy="28" rx="10" ry="8" fill="#2d2d44"/>
      <!-- 眼圈 -->
      <ellipse cx="42" cy="55" rx="16" ry="18" fill="#1a1a2e"/>
      <ellipse cx="78" cy="55" rx="16" ry="18" fill="#1a1a2e"/>
      <!-- 眼白 -->
      <ellipse class="panda-eye-white" cx="44" cy="55" rx="8" ry="14" fill="#fff"/>
      <ellipse class="panda-eye-white" cx="76" cy="55" rx="8" ry="14" fill="#fff"/>
      <!-- 眼珠 -->
      <circle cx="46" cy="57" r="5" fill="#1a1a2e"/>
      <circle cx="78" cy="57" r="5" fill="#1a1a2e"/>
      <!-- 眼睛高光 -->
      <circle cx="47" cy="55" r="2" fill="#fff"/>
      <circle cx="79" cy="55" r="2" fill="#fff"/>
      <!-- 鼻子 -->
      <ellipse cx="60" cy="72" rx="6" ry="4" fill="#1a1a2e"/>
      <!-- 嘴巴 -->
      <path d="M52 78 Q60 84 68 78" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 脸颊红晕 -->
      <ellipse cx="30" cy="70" rx="10" ry="6" fill="rgba(233,69,96,0.3)"/>
      <ellipse cx="90" cy="70" rx="10" ry="6" fill="rgba(233,69,96,0.3)"/>
    </svg>
  </div>

  <h1>熊猫<span class="accent">图片压缩</span></h1>

  <div class="info">
    最多 <b>50</b> 张图片<br>
    单张最大 <b>10MB</b><br>
    自动ZIP下载 🎁
  </div>

  <div class="count" id="count">正在读取次数...</div>

  <label class="upload" id="uploadArea">
    <span class="upload-icon">📷</span>
    <span class="upload-text-main">点击选择图片</span>
    <span class="upload-text-sub">或拖拽图片到这里</span>
    <input id="files" type="file" multiple accept="image/*">
  </label>

  <div class="files" id="list"></div>

  <button class="btn-start" id="start" disabled>🚀 开始压缩</button>

  <div class="progress" id="progress"></div>
  <div class="bar">
    <div class="bar-inner" id="bar"></div>
  </div>

  <div class="result" id="result"></div>

  <div class="footer">服务由 <span class="tiny">Tiny</span> 提供支持 🐼</div>

</div>

<script>
// ===== 星空生成 =====
(function() {
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star' + (Math.random() > 0.8 ? ' big' : '');
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    starsEl.appendChild(star);
  }
})();

// ===== 浮动竹叶 =====
(function() {
  const leaves = ['🎋', '🍃', '🌿', '☘️', '🍀'];
  for (let i = 0; i < 8; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'bamboo-leaf';
    leaf.textContent = leaves[Math.floor(Math.random() * leaves.length)];
    leaf.style.left = Math.random() * 100 + '%';
    leaf.style.fontSize = (20 + Math.random() * 20) + 'px';
    leaf.style.animationDuration = (8 + Math.random() * 12) + 's';
    leaf.style.animationDelay = Math.random() * 10 + 's';
    document.body.appendChild(leaf);
  }
})();

// ===== 烟花效果 =====
function launchConfetti() {
  const container = document.getElementById('confetti');
  const colors = ['#e94560','#f5c518','#4fc3f7','#ab47bc','#ff6b9d','#66bb6a','#fff'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (6 + Math.random() * 8) + 'px';
    c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.animationDelay = Math.random() * 0.5 + 's';
    container.appendChild(c);
  }
  setTimeout(() => { container.innerHTML = ''; }, 4000);
}

// ===== 熊猫点击反应 =====
document.getElementById('pandaWrapper').addEventListener('click', function() {
  this.style.animation = 'none';
  this.offsetHeight; // reflow
  this.style.animation = 'pandaSpin 0.6s ease';
  setTimeout(() => {
    this.style.animation = 'pandaBounce 2s ease-in-out infinite';
  }, 600);
});

// ===== 拖拽视觉反馈 =====
const uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('dragover', e => {
  e.preventDefault();
  uploadArea.classList.add('drag-over');
});
uploadArea.addEventListener('dragleave', e => {
  uploadArea.classList.remove('drag-over');
});
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('drag-over');
  addFiles(e.dataTransfer.files);
});

// ===== 核心功能逻辑（保留原有） =====
let selected = [];
const input = document.getElementById('files');
const list = document.getElementById('list');
const startBtn = document.getElementById('start');
const countBox = document.getElementById('count');
const result = document.getElementById('result');
const progress = document.getElementById('progress');
const bar = document.getElementById('bar');

function formatSize(size) {
  if (size >= 1024 * 1024) {
    return (size / 1024 / 1024).toFixed(2) + ' MB';
  }
  return (size / 1024).toFixed(2) + ' KB';
}

function render() {
  list.innerHTML = '';
  selected.forEach((file, index) => {
    const div = document.createElement('div');
    div.className = 'file';
    div.style.animationDelay = (index * 0.05) + 's';
    div.innerHTML =
      '<span class="file-name">🖼️ ' + file.name + '</span>' +
      '<span class="file-size">' + formatSize(file.size) + '</span>' +
      '<button class="delete-btn" data-index="' + index + '">×</button>';
    list.appendChild(div);
  });
  startBtn.disabled = selected.length === 0;
}

function addFiles(files) {
  for (const file of files) {
    if (file.type.startsWith('image/')) {
      selected.push(file);
    }
  }
  if (selected.length > 50) {
    selected = selected.slice(0, 50);
    alert('最多只能选择50张图片');
  }
  render();
}

input.addEventListener('change', e => {
  addFiles(e.target.files);
});

document.addEventListener('click', e => {
  if (e.target.classList.contains('delete-btn')) {
    const index = Number(e.target.dataset.index);
    selected.splice(index, 1);
    render();
  }
});

startBtn.onclick = async () => {
  if (selected.length === 0) return;

  startBtn.disabled = true;
  progress.innerHTML = '🐼 正在压缩...';
  progress.className = 'progress show';
  bar.parentElement.className = 'bar show';
  bar.style.width = '30%';
  result.innerHTML = '';
  result.className = 'result';

  const form = new FormData();
  selected.forEach(file => {
    form.append('files', file);
  });

  try {
    const res = await fetch('/compress', {
      method: 'POST',
      body: form
    });

    if (!res.ok) {
      throw new Error(await res.text());
    }

    bar.style.width = '80%';

    const before = Number(res.headers.get('X-Before-Size'));
    const after = Number(res.headers.get('X-After-Size'));
    const percent = ((before - after) / before * 100).toFixed(2);

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'compressed.zip';
    a.click();
    URL.revokeObjectURL(url);

    bar.style.width = '100%';

    result.innerHTML =
      '压缩前：<b>' + formatSize(before) + '</b><br>' +
      '压缩后：<b>' + formatSize(after) + '</b><br>' +
      '节省：<b>' + percent + '%</b> 🎉';
    result.className = 'result show';

    selected = [];
    render();

    progress.innerHTML = '✨ 压缩完成！熊猫为你鼓掌 🐼👏';
    progress.className = 'progress success';

    // 🎉 烟花庆祝
    launchConfetti();

    getCount();

  } catch (e) {
    alert(e.message);
    progress.innerHTML = '❌ 处理失败';
    progress.className = 'progress';
  }

  startBtn.disabled = false;
};

async function getCount() {
  try {
    const res = await fetch('/count?t=' + Date.now());
    const data = await res.json();
    countBox.innerHTML =
      '本月已使用：<b>' + data.used + '</b> / ' + data.limit + '<br>' +
      '剩余：<b>' + data.remaining + '</b> 次';
  } catch (e) {
    countBox.innerHTML = '次数读取失败';
  }
}

getCount();
</script>
</body>
</html>
