<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
熊猫图片压缩
</title>


<style>


*{

box-sizing:border-box;

}


body{

margin:0;

min-height:100vh;

padding:20px;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(
135deg,
#2193b0,
#6dd5ed
);

font-family:

Arial,
"Microsoft YaHei",
sans-serif;

}



.container{

width:100%;

max-width:620px;

background:white;

border-radius:30px;

padding:35px;

text-align:center;

box-shadow:

0 15px 40px rgba(0,0,0,.18);

}



.panda{

font-size:80px;

}



h1{

margin:10px 0 20px;

}



.info{

background:#f3fbff;

padding:18px;

border-radius:18px;

line-height:30px;

}



.count{

margin:20px 0;

padding:15px;

background:#fafafa;

border-radius:15px;

}



.upload{

display:block;

padding:40px 20px;

border:3px dashed #0984e3;

border-radius:20px;

cursor:pointer;

font-size:18px;

}


.upload:hover{

background:#f3fbff;

}


input{

display:none;

}




.files{

margin-top:20px;

max-height:260px;

overflow:auto;

text-align:left;

}



.file{


position:relative;


padding:

12px 55px 12px 12px;


background:#f7f7f7;


border-radius:12px;


margin-bottom:8px;


line-height:22px;


font-size:14px;


min-height:52px;


display:flex;


flex-direction:column;


justify-content:center;


align-items:flex-start;


text-align:left;


}





.delete-btn{


position:absolute;


right:12px;


top:50%;


transform:translateY(-50%);



width:30px;


height:30px;


display:flex;


align-items:center;


justify-content:center;



padding:0;


margin:0;



border:0;


border-radius:50%;


background:#ff7675;


color:white;


font-size:20px;


line-height:1;


cursor:pointer;


}



button:not(.delete-btn){


margin-top:25px;


width:80%;


padding:15px;


border:0;


border-radius:35px;


background:#0984e3;


color:white;


font-size:17px;


cursor:pointer;


}



button:disabled{


opacity:.5;


}



.progress{


margin-top:20px;


}



.bar{


height:12px;


background:#eee;


border-radius:20px;


overflow:hidden;


margin-top:10px;


}



.bar-inner{


height:100%;


width:0;


background:#0984e3;


transition:.3s;


}



.result{


margin-top:20px;


padding:15px;


background:#f7f7f7;


border-radius:15px;


text-align:left;


line-height:25px;


}



</style>


</head>


<body>


<div class="container">


<div class="panda">

🐼

</div>



<h1>
熊猫图片压缩
</h1>



<div class="info">

最多

<b>50</b>

张图片

<br>

单张最大

<b>10MB</b>

<br>

自动ZIP下载

</div>



<div class="count" id="count">

正在读取次数...

</div>



<label class="upload">


📷

<br>

点击选择图片

<br>

或拖拽图片



<input

id="files"

type="file"

multiple

accept="image/*">


</label>



<div class="files" id="list"></div>



<button id="start" disabled>

开始压缩

</button>



<div class="progress" id="progress"></div>



<div class="bar">

<div class="bar-inner" id="bar">

</div>

</div>



<div class="result" id="result">

</div>



</div>


<script>
let selected=[];


const input=document.getElementById("files");

const list=document.getElementById("list");

const start=document.getElementById("start");

const countBox=document.getElementById("count");

const result=document.getElementById("result");

const progress=document.getElementById("progress");

const bar=document.getElementById("bar");



function formatSize(size){


if(size>=1024*1024){

return (
size/1024/1024
).toFixed(2)+" MB";

}


return (
size/1024
).toFixed(2)+" KB";


}






function render(){


list.innerHTML="";


selected.forEach((file,index)=>{


const div=document.createElement("div");


div.className="file";



div.innerHTML=

"🖼️ "

+

file.name

+

"<br>"

+

formatSize(file.size)

+

`

<button class="delete-btn" data-index="${index}">
×
</button>

`;



list.appendChild(div);



});



start.disabled=

selected.length===0;



}







function addFiles(files){



for(const file of files){



if(

file.type.startsWith("image/")

){



selected.push(file);


}



}




if(selected.length>50){



selected=

selected.slice(0,50);



alert(
"最多只能选择50张图片"
);


}



render();


}







input.addEventListener(

"change",

e=>{


addFiles(

e.target.files

);


});







const upload=

document.querySelector(".upload");





upload.addEventListener(

"dragover",

e=>{


e.preventDefault();


});






upload.addEventListener(

"drop",

e=>{


e.preventDefault();


addFiles(

e.dataTransfer.files

);


});







document.addEventListener(

"click",

e=>{



if(

e.target.classList.contains(

"delete-btn"

)

){



const index=

Number(

e.target.dataset.index

);



selected.splice(

index,

1

);



render();


}



});








start.onclick=async()=>{



if(selected.length===0)

return;






start.disabled=true;



progress.innerHTML=

"正在压缩...";



bar.style.width="30%";



result.innerHTML="";





const form=new FormData();




selected.forEach(file=>{


form.append(

"files",

file

);


});





try{



const res=

await fetch(

"/compress",

{

method:"POST",

body:form

}

);





if(!res.ok){



throw new Error(

await res.text()

);


}






bar.style.width="80%";






const before=

Number(

res.headers.get(

"X-Before-Size"

)

);



const after=

Number(

res.headers.get(

"X-After-Size"

)

);







const percent=

(

(before-after)

/before*

100

).toFixed(2);






const blob=

await res.blob();





const url=

URL.createObjectURL(blob);





const a=

document.createElement("a");



a.href=url;



a.download=

"compressed.zip";



a.click();





URL.revokeObjectURL(url);







bar.style.width="100%";






result.innerHTML=

`

压缩前：

<b>${formatSize(before)}</b>

<br>

压缩后：

<b>${formatSize(after)}</b>

<br>

节省：

<b>${percent}%</b>

`;






// 清空列表

selected=[];

render();






progress.innerHTML=

"压缩完成 ✓";





getCount();







}catch(e){



alert(

e.message

);



progress.innerHTML=

"处理失败";



}



start.disabled=false;



};









async function getCount(){


try{



const res=

await fetch(

"/count?t="+Date.now()

);





const data=

await res.json();






countBox.innerHTML=

`

本月已使用：

<b>${data.used}</b>

/

${data.limit}

<br>

剩余：

<b>${data.remaining}</b>

次

`;




}catch(e){



countBox.innerHTML=

"次数读取失败";


}



}






getCount();



</script>


</body>


</html>
